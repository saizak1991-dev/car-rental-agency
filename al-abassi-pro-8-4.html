:root{--gold:#c9a24b;--gl:#e4c988;--gd:#8a6a22;--ink:#140b08;--cream:#faf6ef;--tx:#2c1c17;--mu:#7a675a;--ln:rgba(201,162,75,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--tx);font-family:'Gothic','Somar',sans-serif;font-weight:400}
header{background:linear-gradient(180deg,#120a07,#1b0f0b);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gold)}
header img{height:38px}
.lg{display:flex;gap:4px;border:1px solid var(--ln);border-radius:20px;padding:2px;direction:ltr}
.lg button{border:0;background:none;color:#cdb27a;padding:5px 11px;border-radius:16px;font:inherit;font-size:11px;letter-spacing:1px}
.lg button.on{background:linear-gradient(135deg,#efd9a0,#c9a24b);color:#1a0e0a}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fffdf8;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,11,8,.05)}
h2{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gd);font-weight:500;margin:0 0 12px}
textarea,input,select{width:100%;font:inherit;font-size:15px;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0}
textarea{height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g>div{min-width:0}.f{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.b{font:inherit;font-size:15px;border:1px solid var(--gold);background:#fff;color:var(--gd);border-radius:12px;padding:11px;cursor:pointer}
.seg button.on,.b.gold{background:linear-gradient(135deg,#efd9a0,#c9a24b);color:#241512;border-color:transparent;font-weight:500}
.b.dark{background:linear-gradient(135deg,#1d110d,#2e1c15);color:var(--gl)}
.av button.on.ok{background:#2e8b57;color:#fff;border-color:transparent}
.av button.on.no{background:#c0392b;color:#fff;border-color:transparent}
.warn{display:none;margin-top:10px;background:#fdecea;color:#a12a1e;border:1px solid #e6b1aa;border-radius:10px;padding:9px 12px;font-size:13px}
.act{display:grid;gap:8px;margin-top:4px}
.msg{font-size:12px;color:var(--mu);margin-top:6px;min-height:16px}
/* document */
#doc{background:#fff;border:1px solid var(--gold);outline:1px solid var(--ln);outline-offset:-7px;padding:26px 22px;font-size:12.5px;line-height:1.6}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:#140b08;margin:-26px -22px 18px;padding:14px 22px}
.dh img{height:44px}.dt{text-align:end;color:var(--gl)}
.dt b{display:block;font-size:20px;letter-spacing:3px;font-weight:500}.dt span{font-size:12px;color:#d9c9a5}
.bx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bx div{border:1px solid var(--ln);border-radius:8px;padding:9px 11px}
.bx small{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gd)}
table{width:100%;border-collapse:collapse;margin:6px 0 10px}
th{background:#f6efe0;color:var(--gd);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-align:start;padding:8px}
td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
.n{text-align:end;white-space:nowrap}
.tot{margin-inline-start:auto;width:64%;min-width:220px}
.tot div{display:flex;justify-content:space-between;padding:4px 8px}
.tot .ttl{background:linear-gradient(135deg,#efd9a0,#c9a24b);color:#241512;font-weight:600;border-radius:6px;margin-top:4px;padding:7px 8px;font-size:14px}
.st{display:inline-block;border:1px solid;border-radius:20px;padding:2px 12px;font-size:11px;letter-spacing:1px}
.pay2{border:1px solid var(--ln);background:#fbf6ea;border-radius:8px;padding:9px 11px;margin:12px 0;font-size:11.5px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.sg div{border-top:1px solid var(--gold);padding-top:5px;height:64px;font-size:10.5px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.ft{text-align:center;font-size:10.5px;color:var(--mu);margin-top:12px;border-top:1px solid var(--ln);padding-top:8px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px;break-inside:avoid}
.cg table{margin:0}.cg th{background:#140b08;color:var(--gl);text-align:center;font-size:11px;padding:6px}
.cg td{border:1px solid var(--ln);padding:5px 8px;font-size:11px}.cg td:first-child{color:var(--gd);width:46%}.cg td:last-child{font-weight:600}
.tp{margin-top:22px;padding-top:14px;border-top:2px dashed var(--ln)}.terms{margin:14px 0;border:1px solid var(--gold);border-radius:6px;overflow:hidden}.terms li{break-inside:avoid}
.terms h3{margin:0;background:#140b08;color:var(--gl);text-align:center;font-size:13px;font-weight:500;padding:6px}
.terms ul{margin:0;padding:8px 12px;padding-inline-start:26px;font-size:11px;line-height:1.75}.terms li::marker{color:var(--gd)}

 const car=lines.find(l=>l.includes("🚗")),nm=lines.find(l=>l.includes("👤")),ph=lines.find(l=>l.includes("📞"));
 const val=l=>l.replace(/^[^:：]*[:：]\s*\**\s*/,"").replace(/\*/g,"").trim();
 if(nm){$("#nm").value=val(nm.replace(/👤/,""));hit++;}
 if(ph){const p=dg(val(ph.replace(/📞/,"")));$("#ph").value=p;hit++;}
 if(car){const v=car.replace(/^.*?[:：]/,"").replace(/\*/g,"").trim().toLowerCase();const i=CARS.findIndex(c=>{const k=c.split(/\s[–—-]\s/)[0].toLowerCase();return v.includes(k)||k.includes(v.split(/\s[–—-]\s/)[0].trim());});if(i>=0){$("#car").value=i;hit++;}}
 if(cal[0]){const v=cal[0].replace(/^.*?[:：]\s*\**/,"");const d=pdate(v);if(d){$("#s1").value=d;hit++;}const tm=ptime(v.split(/[—–]/).pop());if(tm)$("#s2").value=tm;}
 if(cal[1]){const v=cal[1].replace(/^.*?[:：]\s*\**/,"");const d=pdate(v);if(d){$("#e1").value=d;hit++;}const tm=ptime(v.split(/[—–]/).pop());$("#e2").value=tm||$("#s2").value;}
 else if($("#s2").value)$("#e2").value=$("#s2").value;
const setv=(em,id,f)=>{const l=lines.find(x=>x.includes(em));if(!l)return;let v=val(l.replace(em,""));if(f)v=f(v);if(v){$(id).value=v;hit++;}};
setv("🎂","#fb");setv("🏠","#fa");setv("🛂","#fp",dg);setv("🎫","#fl",dg);setv("📆","#fld",pdate);setv("💼","#fpr");
 $("#fmsg").textContent=hit?t("ok"):t("ko");render();}
$("#fill").onclick=fill;$("#raw").addEventListener("paste",()=>setTimeout(fill,60));

const GS=`// Al-Abassi Pro -> Google Sheet
// Colle ce code dans Extensions > Apps Script, puis Déployer > Application Web
const HEAD=["Enregistré le","Type","N°","Client","Téléphone","Véhicule","Disponibilité","Départ","Retour","Jours","Prix/jour","Sous-total","Remise","TVA %","TVA","Total","Caution","Acompte","Reste","Statut","Paiement","Remarques"];

function saveClient(ss,d){
  if(!d.name&&!d.phone)return;
  const H=["Enregistré le","Mis à jour le","Nom","Téléphone","Naissance (date et lieu)","Adresse","N° passeport","N° permis","Date permis","Profession","Dernier document","Nb documents"];
  let sh=ss.getSheetByName("Clients")||ss.insertSheet("Clients");
  if(sh.getLastRow()===0){
    sh.appendRow(H);sh.setFrozenRows(1);
    sh.getRange(1,1,1,H.length).setFontWeight("bold").setBackground("#e4c988");
    ["D:D","G:G","H:H","I:I"].forEach(r=>sh.getRange(r).setNumberFormat("@"));
  }
  const now=Utilities.formatDate(new Date(),"Africa/Algiers","yyyy-MM-dd HH:mm");
  const digits=x=>String(x||"").replace(/[^0-9]/g,"");
  const key=digits(d.phone),doc=d.type+" "+d.no;
  const nw=[d.name,d.phone,d.birth,d.addr,d.passport,d.licence,d.licenceDate,d.job];
  const last=sh.getLastRow();let r=0,old=null;
  if(last>1){
    const v=sh.getRange(2,1,last-1,H.length).getValues();
    for(let i=0;i<v.length;i++){
      const same=key?digits(v[i][3])===key:String(v[i][2]).trim()===String(d.name).trim();
      if(same){r=i+2;old=v[i];break;}
    }
  }
  if(r){
    const m=nw.map((x,i)=>x?x:old[i+2]);
    const cnt=(Number(old[11])||1)+(String(old[10])===doc?0:1);
    sh.getRange(r,2,1,H.length-1).setValues([[now].concat(m,[doc,cnt])]);
  }else{
    sh.appendRow([now,now].concat(nw,[doc,1]));
  }
}

function doGet(){
  return ContentService.createTextOutput("Al-Abassi Pro: OK");
}

function doPost(e){
  const d=JSON.parse(e.postData.contents);
  const lock=LockService.getScriptLock();
  lock.waitLock(15000);
  try{
    const ss=SpreadsheetApp.openById("1pvs0tPwtuOeKXnG2GVmEEDg-H4AYMbRK5IMbPQRykI4");
    let sh=ss.getSheetByName("Documents")||ss.insertSheet("Documents");
    if(sh.getLastRow()===0){
      sh.appendRow(HEAD);
      sh.setFrozenRows(1);
      sh.getRange(1,1,1,HEAD.length).setFontWeight("bold").setBackground("#e4c988");
      ["E:E","H:H","I:I"].forEach(r=>sh.getRange(r).setNumberFormat("@"));
    }
    const row=[Utilities.formatDate(new Date(),"Africa/Algiers","yyyy-MM-dd HH:mm"),d.type,d.no,d.name,d.phone,d.car,d.avail,d.start,d.end,d.days,d.pday,d.sub,d.disc,d.tvaPct,d.tva,d.total,d.deposit,d.advance,d.rest,d.status,d.pay,d.notes];
    // même Type + même N° => mise à jour (pas de doublon)
    let r=0;const last=sh.getLastRow();
    if(last>1){
      const v=sh.getRange(2,2,last-1,2).getValues();
      for(let i=0;i<v.length;i++){if(v[i][0]===d.type&&String(v[i][1])===String(d.no)){r=i+2;break;}}
    }
    if(r)sh.getRange(r,1,1,row.length).setValues([row]);else sh.appendRow(row);
    saveClient(ss,d);
    return ContentService.createTextOutput("ok");
  }finally{lock.releaseLock();}
}
`;
